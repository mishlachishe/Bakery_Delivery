services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bakery_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  order-service:
    build: ./order-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres

  production-service:
    build: ./production-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres

  delivery-service:
    build: ./delivery-service
    ports:
      - "8083:8000"
    depends_on:
      - postgres
      - order-service

  payment-service:
    build: ./payment-service
    ports:
      - "8084:8000"
    depends_on:
      - postgres

  notification-service:
    build: ./notification-service
    ports:
      - "8085:8000"
    depends_on:
      - postgres
      - payment-service

  complaint-service:
    build: ./complaint-service
    ports:
      - "8086:8000"
    depends_on:
      - postgres

volumes:
  pgdata: